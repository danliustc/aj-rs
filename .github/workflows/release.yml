name: Release

# Push a tag like v0.1.0 to publish prebuilt binaries to a GitHub release.
# Manual runs build everything and keep the archives as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$crate" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$crate"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          name="autojump-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/autojump" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' # cross-compiled, can't run on arm64
        run: |
          "target/${{ matrix.target }}/release/autojump" --version
          file "target/${{ matrix.target }}/release/autojump"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.package.outputs.archive }}

  # Render the Homebrew formula from the archives above and attach it to the
  # release. If the HOMEBREW_TAP_TOKEN secret is set (a token with write
  # access to danliustc/homebrew-tap), also commit it to the tap.
  homebrew:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: tools/homebrew-formula.sh "$GITHUB_REF_NAME" dist > aj-rs.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: aj-rs.rb
      - name: Update tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/danliustc/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp aj-rs.rb tap/Formula/aj-rs.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/aj-rs.rb
          git diff --cached --quiet || git commit -m "aj-rs $GITHUB_REF_NAME"
          git push
